name: iOS 모바일 실행 검증
on:
  workflow_dispatch:
    inputs:
      sharedCheckedRevision:
        description: 이미 통과한 공용 검사 기준 SHA (비워두면 전체 검사)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HB_MOBILE_PROOF_EXPORT: native/build/mobile-proof.json
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: C++ 공유 객체와 순서 보존 묶음 호출 검증
        if: inputs.sharedCheckedRevision == ''
        run: |
          node tools/check-play-world-native.mjs
          node tools/check-native-batch.mjs --cpp
          node tools/check-native-chain.mjs --cpp
          node tools/check-native-action-batch.mjs --cpp
          node tools/check-native-module-query.mjs --cpp
          node tools/check-project-native.mjs
          node tools/check-light-blend-styles.mjs
          node tools/check-native-transport.mjs
          node tools/check-native-frame.mjs
          node tools/check-native-frame-concurrency.mjs
          node tools/check-runtime.mjs
          node tools/check-headless.mjs
          node tools/check-ui-state-cache.mjs
          node tools/check-ui-audio.mjs
          node tools/check-audio-sources.mjs
          node tools/check-buffered-audio.mjs
          node tools/check-streaming-audio.mjs
          node tools/check-render-resources.mjs
          node tools/ios-audio-probe.mjs --check
          node tools/check-runtime-features.mjs
          node tools/check-player-lifecycle.mjs
          node tools/check-asset-cache.mjs
          node tools/check-state-native-batch.mjs
          node tools/check-behavior-native-batch.mjs
      - name: 동일 실행 소스 확인과 남은 공용 검사
        if: inputs.sharedCheckedRevision != ''
        env:
          SHARED_REVISION: ${{ inputs.sharedCheckedRevision }}
        run: |
          [[ "$SHARED_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --depth=1 origin "$SHARED_REVISION"
          changes=$(git diff --name-only "$SHARED_REVISION" HEAD)
          while IFS= read -r file; do
            case "$file" in
              ''|docs/*|tools/check-player-lifecycle.mjs|.github/workflows/mobile-ios.yml) ;;
              *) echo "실행 소스가 바뀌어 전체 검사가 필요해요: $file"; exit 1 ;;
            esac
          done <<< "$changes"
          node tools/check-player-lifecycle.mjs
          node tools/check-frame-rate.mjs
          node tools/check-native-channel.mjs
          node tools/check-asset-cache.mjs
          node tools/check-state-native-batch.mjs
          node tools/check-behavior-native-batch.mjs
      - name: 공용 실행과 실제 사용자 C++ 포함 프로젝트 출력
        run: node tools/check-mobile-player.mjs
      - name: Xcode 컴파일과 시뮬레이터 실행
        run: node tools/check-ios-mobile.mjs
      - name: 실행 보고와 화면 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-mobile-proof
          path: |
            native/build/mobile-proof.json
            native/build/native-module-*/acceptance.json
            native/build/runtime-features-*/acceptance.json
            native/build/mobile-player-*/acceptance.json
            native/build/mobile-player-*/모바일 출력/Builds/ios/*/ios-*.json
            native/build/mobile-player-*/모바일 출력/Builds/ios/*/ios-*.png
            native/build/mobile-player-*/모바일 출력/Builds/ios/*/ios-*.txt
            native/build/mobile-player-*/모바일 출력/Builds/ios/*/HBGame*.ips
          retention-days: 7
