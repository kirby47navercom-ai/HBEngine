<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>위젯·오디오 실행 검사</title><link rel="stylesheet" href="/prototype/ui-editor.css"></head>
<body><button id="run">검사 실행</button><pre id="output">준비</pre><div id="overlay" style="position:relative;width:640px;height:360px"></div>

<script type="module">
import {createAsset} from '/prototype/asset-documents.js';

import {createAudioMixer,AudioMixerGraph,AudioRouting} from '/prototype/audio-mixer.js';

import {BlueprintRuntime} from '/prototype/blueprint-runtime.js';

const assert=(ok,message)=>{if(!ok)throw Error(message);};
async function pcm(volume,{mute=false,solo=false,frequency=440,lowpass=20000,bypass=false}={}){
  const context=new OfflineAudioContext(1,24000,48000),data=createAudioMixer('MX_PCM');data.buses.find(b=>b.id==='music').volumeDb=volume;data.buses.find(b=>b.id==='music').mute=mute;data.buses.find(b=>b.id==='sfx').solo=solo;data.buses[0].lowpass=lowpass;data.buses[0].bypass=bypass;data.buses.find(b=>b.id==='music').bypass=bypass;
  const graph=new AudioMixerGraph(context,data),source=context.createOscillator();source.frequency.value=frequency;source.connect(graph.input('music'));source.start();const rendered=await context.startRendering(),values=rendered.getChannelData(0).slice(8000),rms=Math.sqrt(values.reduce((sum,v)=>sum+v*v,0)/values.length);graph.dispose();return rms;
}
async function spriteGPU(){
  const image=document.createElement('canvas');image.width=image.height=8;const ctx=image.getContext('2d');ctx.fillStyle='#0000ff';ctx.fillRect(0,0,8,8);ctx.fillStyle='#ffff00';ctx.fillRect(2,2,4,4);ctx.fillStyle='#ff0000';for(const x of [0,6])for(const y of [0,6])ctx.fillRect(x,y,2,2);

  try{await visuals.build(object,group);renderer.render(world,camera);const gl=renderer.getContext(),pixel=(x,y)=>{const data=new Uint8Array(4);gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,data);return [...data];};assert(pixel(8,8)[0]>240&&pixel(8,8)[2]<10,'GPU 모서리');assert(pixel(20,8)[2]>240&&pixel(20,8)[0]<10,'GPU Sliced 모서리 크기 보존');assert(pixel(96,64)[0]>240&&pixel(96,64)[1]>240,'GPU 중앙 확장');object.components[0].properties.drawMode='tiled';await visuals.spriteFrame(object,'Assets/S_Nine.hbsprite.json');renderer.render(world,camera);assert(gl.getError()===gl.NO_ERROR&&renderer.info.render.triangles>18,'GPU Tiled 반복 geometry');return true;}finally{visuals.dispose(group);renderer.dispose();renderer.domElement.remove();}
}
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#output');output.textContent='검사 중';let ui,vm;try{
  const widget=createAsset('widget','W_QA'),button=createWidgetNode('Button','button');button.name='Confirm';button.properties.text='확인';button.events.click='OnConfirm';widget.nodes.push(button);const owner={id:'owner',kind:'empty',name:'Owner',position:[0,0,0],rotation:[0,0,0],scale:[1,1,1],visible:true};
  const root=createAsset('blueprint','BP_UI');root.variables=[{id:'clicked',name:'Clicked',type:'bool',value:false,container:'single'}];const begin=root.nodes.find(n=>n.key==='beginPlay'),show=makeNode('uiShow');show.inputValues={asset:'Assets/W_QA.hbwidget.json',instance:'hud'};const event=makeNode('customEvent');event.options={eventName:'OnConfirm'};const setter=makeNode('setVariable');setter.variableId='clicked';setter.inputValues={value:true};root.nodes.push(show,event,setter);root.edges=[{from:{node:begin.id,pin:'then'},to:{node:show.id,pin:'exec'}},{from:{node:event.id,pin:'then'},to:{node:setter.id,pin:'exec'}}];
  ui=new WidgetSystem({readAsset:async()=>widget,overlay:()=>document.querySelector('#overlay')});vm=new BlueprintRuntime([owner],[{root,self:owner.id}],{operation:(...args)=>ui.operation(...args),physics:async(_dt,vm)=>ui.tick(vm)});await vm.start();const el=document.querySelector('[data-widget-name="Confirm"]');assert(el instanceof HTMLButtonElement,'실제 버튼 생성');el.click();await vm.tick(.016);assert(vm.bindings[0].variables.get('clicked')===true,'버튼 → 사용자 이벤트 → BP 변수 변경');await ui.operation('uiSetEnabled',{instance:'hud',element:'Confirm',enabled:false},{self:owner.id},vm);assert(el.disabled,'비활성화가 DOM 입력을 차단');
  const inputs=createAsset('widget','W_Inputs'),panel=createWidgetNode('Panel','panel'),input=createWidgetNode('TextInput','input','panel'),check=createWidgetNode('CheckBox','check','panel');panel.name='Panel';input.name='Input';check.name='Check';inputs.nodes.push(panel,input,check);const signals=[],host=document.createElement('div');document.body.append(host);const controls=renderWidgetTree(host,inputs,{event:(node,type)=>signals.push({type,text:node.properties.text,checked:node.properties.checked})});try{const text=controls.elements.get('input');text.value='제출할 값';text.dispatchEvent(new Event('input'));text.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}));assert(signals.some(e=>e.type==='submit'&&e.text==='제출할 값'),'현재 입력값을 제출');const box=controls.elements.get('check').querySelector('input');box.click();assert(signals.some(e=>e.type==='click'&&e.checked),'체크 click이 변경된 값 전달');panel.properties.enabled=false;controls.update();assert(text.disabled&&box.disabled,'부모 비활성화 상속');}finally{controls.dispose();host.remove();}

  const normal=await pcm(0),quiet=await pcm(-6),muted=await pcm(0,{mute:true}),solo=await pcm(0,{solo:true}),treble=await pcm(0,{frequency:8000}),filtered=await pcm(0,{frequency:8000,lowpass:500}),bypassed=await pcm(0,{frequency:8000,lowpass:500,bypass:true});assert(Math.abs(quiet/normal-10**(-6/20))<.005,'실제 PCM -6dB 감쇠');assert(muted===0&&solo===0,'실제 PCM mute/solo 무음');assert(filtered/treble<.02,'실제 필터가 고주파를 감쇠');assert(Math.abs(bypassed-Math.SQRT1_2)<.001,'Bypass가 효과 체인을 실제로 우회');const nineSliceGPU=await spriteGPU();output.dataset.status='passed';output.textContent=JSON.stringify({status:'passed',widgetEvent:true,nativeDOM:true,spatialNode:true,nineSliceGPU,rms:{normal,quiet,muted,solo,treble,filtered,bypassed},gainRatio:quiet/normal},null,2);
}catch(error){output.dataset.status='failed';output.textContent=error.stack;}finally{await vm?.stop();ui?.dispose();}};
</script></body></html>
